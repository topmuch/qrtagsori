# ════════════════════════════════════════════════════════════════════
# QRTags — nixpacks.toml pour Coolify
#
# ⚠️ Coolify utilise nixpacks (PAS le Dockerfile) pour builder.
# ════════════════════════════════════════════════════════════════════

[phases.setup]
nixPkgs = ['nodejs_20', 'openssl']
aptPkgs = ['sqlite3', 'ca-certificates']

[phases.install]
cmds = [
  'npm install --legacy-peer-deps --no-audit --no-fund'
]

[phases.build]
cmds = [
  'npx prisma generate',
  'npm run build',
  'npm prune --production'
]
dependsOn = ['install']

[start]
cmd = 'mkdir -p /app/data /app/data/backups /app/public/uploads/damage && npx prisma db push --skip-generate --accept-data-loss 2>&1; node scripts/migrate-qrtags-columns.cjs 2>&1; node server.js'

[variables]
NODE_ENV = 'production'
NEXT_TELEMETRY_DISABLED = '1'
PORT = '3000'
HOSTNAME = '0.0.0.0'
DATABASE_URL = 'file:/app/data/qrtags.db'
NIXPACKS_PACKAGE_MANAGER = 'npm'
